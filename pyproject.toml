[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jring-client"
version = "0.6.8"
description = "Privacy-first Linux client for explicitly selected JRing BLE devices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "accessibility",
    "assistive-technology",
    "automation",
    "ble",
    "bluetooth",
    "bluetooth-low-energy",
    "bluez",
    "command-line",
    "input-device",
    "jring",
    "linux",
    "linux-input",
    "privacy",
    "smart-ring",
    "uinput",
    "wearable",
]
dependencies = [
    "bleak>=0.22,<2",
    "evdev>=1.7,<2",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Documentation = "https://github.com/Pipeliner/jring-client/tree/main/docs"
Issues = "https://github.com/Pipeliner/jring-client/issues"
Repository = "https://github.com/Pipeliner/jring-client"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "setuptools==84.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
jring = "jring.cli:main"
jring-tui = "jring.cli:tui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jring = [
    "resources/completions/jring.bash",
    "resources/man/jring.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
