[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jring-client"
version = "0.5.0"
description = "Privacy-first Linux client for explicitly selected JRing BLE devices"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "accessibility",
    "bluetooth-low-energy",
    "command-line",
    "input-device",
    "jring",
    "linux",
    "privacy",
    "uinput",
    "wearable",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Pipeliner/jring-client/tree/main/docs"
Issues = "https://github.com/Pipeliner/jring-client/issues"
Repository = "https://github.com/Pipeliner/jring-client"

[project.optional-dependencies]
ble = ["bleak>=0.22,<2"]
input = ["evdev>=1.7,<2"]
dev = [
    "pytest>=8.0",
    "setuptools==84.0.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
jring = "jring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
