[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jring-client"
version = "0.5.0"
description = "Privacy-first Linux client for explicitly selected JRing BLE devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ble = ["bleak>=0.22,<2"]
input = ["evdev>=1.7,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
jring = "jring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
